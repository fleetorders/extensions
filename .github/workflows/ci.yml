name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The provider switcher's package, checked against the exact file list a release ships.
  # vsce does not read .gitignore, so a stray file would otherwise ship unnoticed.
  switcher-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-code-provider-switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: .
      - name: package dry-run (what would ship)
        env:
          # vscode:prepublish runs the maintainer's content check, which CI does not have.
          ARTIFACT_CHECK_SKIP: "1"
        run: |
          npm run build:production
          npx --no-install vsce ls --no-dependencies | sort > /tmp/shipped
          sort > /tmp/expected <<'LIST'
          CHANGELOG.md
          LICENSE
          README.md
          bin/gephyra-wrapper
          dist/extension.js
          media/icon.png
          package.json
          LIST
          diff /tmp/expected /tmp/shipped || {
            echo "::error::extension package contents differ from the expected list"; exit 1; }
