<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Markdown Preview Style — a page of comfortable type set on the golden deck">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a3a"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a913"/>
      <stop offset="0.5" stop-color="#ffd970"/>
      <stop offset="1" stop-color="#e8a913"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#sky)"/>

    <!-- water -->
    <rect y="170" width="256" height="86" fill="#1b3348"/>
    <g fill="none" stroke="#33608a" stroke-width="3" stroke-linecap="round">
      <path d="M-6 196 q16 -7 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" opacity="0.7"/>
      <path d="M-18 218 q16 -7 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" opacity="0.45"/>
      <path d="M-6 240 q16 -7 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" opacity="0.25"/>
    </g>

    <!-- shores -->
    <path d="M-4 158 H44 v16 H-4 Z" fill="#33445a"/>
    <path d="M212 158 H260 v16 H212 Z" fill="#33445a"/>

    <!-- the page, standing on the deck -->
    <path d="M100 56 h42 l16 16 v78 h-58 z" fill="#dfe8f2"/>
    <polygon points="142,56 142,72 158,72" fill="#b6c6d8"/>
    <g fill="#e8a913">
      <rect x="110" y="80" width="36" height="4.5" rx="2"/>
      <rect x="110" y="92" width="36" height="4.5" rx="2"/>
      <rect x="110" y="104" width="26" height="4.5" rx="2"/>
      <rect x="110" y="118" width="36" height="4.5" rx="2"/>
      <rect x="110" y="130" width="20" height="4.5" rx="2"/>
    </g>

    <!-- the golden deck under the page -->
    <rect x="18" y="150" width="220" height="13" rx="4.5" fill="url(#span)"/>
  </g>
</svg>
